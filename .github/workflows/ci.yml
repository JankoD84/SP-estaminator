name: CI

on:
  push:
    branches: [claude/agile-story-point-estimator-N7eeC]
  pull_request:
    branches: [claude/agile-story-point-estimator-N7eeC]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q estimator_app.py estimator_cli.py
